[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-runrun"
version = "1.0.0"
description = "MCP server for Runrun.it API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-runrun = "mcp_runrun.server:main"

[tool.setuptools.packages.find]
where = ["src"]
